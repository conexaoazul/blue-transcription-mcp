# blue-transcription — stack consolidada (engines + todas as surfaces)
# Substitui: compose.web.yml (runtime project) e /docker/blue-transcription-chatgpt/compose.yml
# Proxy chatgpt (proxy nginx) deixado de fora: exited há 4 dias, sem consumer.
# Deploy: docker compose -f compose.all.yml up -d (project name = blue-transcription)

name: blue-transcription

networks:
  trans:
    external: true
    name: blue-transcription-chatgpt-local
  web:
    external: true
    name: web

services:
  whisper:
    container_name: blue-transcription-whisper-local
    image: ca/whisper.cpp:ivybridge-20261004
    restart: unless-stopped
    cpus: 4
    mem_limit: 4g
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        set -e;
        test -s /models/ggml-small.bin || ./models/download-ggml-model.sh small /models;
        exec ./build-ivybridge/bin/whisper-server
        --model /models/ggml-small.bin
        --host 0.0.0.0 --port 8082
        --inference-path /v1/audio/transcriptions
        --convert --threads 4
    volumes:
      - /docker/blue-transcription-chatgpt/models:/models
    networks:
      trans:
        aliases: [whisper-local]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8082'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  mcp-chatgpt:
    container_name: blue-transcription-mcp-chatgpt-backend
    image: ghcr.io/conexaoazul/blue-transcription-mcp-candidate@sha256:f821d20d24d014953d74132387542d755d94f1217ed090563a8696bc88b41f32
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,uid=1000,gid=1000
    environment:
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "8083"
      WHISPER_URL: http://whisper-local:8082/v1/audio/transcriptions
      MCP_AUTH_TOKEN_FILE: /run/secrets/transcription_mcp_auth
      OUTPUT_DIR: /tmp/output
      TMPDIR: /tmp
      MAX_INLINE_BYTES: "26214400"
      MAX_INLINE_ZIP_BYTES: "26214400"
      MAX_BATCH_FILES: "100"
      BATCH_CONCURRENCY: "1"
      MAX_BATCH_ITEM_BYTES: "262144000"
      MAX_ZIP_EXTRACT_BYTES: "536870912"
      MAX_ZIP_ENTRIES: "5000"
      MAX_DOWNLOAD_BYTES: "524288000"
      MCP_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,mcp-chatgpt-backend:8083,blue-transcription-mcp-chatgpt-backend:8083"
      MCP_ALLOWED_ORIGINS: "http://127.0.0.1:*,http://localhost:*"
    volumes:
      - /docker/blue-transcription-chatgpt/token:/run/secrets/transcription_mcp_auth:ro
    networks:
      trans:
        aliases: [mcp-chatgpt-backend]
    depends_on:
      whisper:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  public:
    container_name: blue-transcription-mcp-public
    image: ghcr.io/conexaoazul/blue-transcription-mcp-candidate@sha256:f821d20d24d014953d74132387542d755d94f1217ed090563a8696bc88b41f32
    restart: unless-stopped
    read_only: true
    entrypoint: ["python", "/app/public_server.py"]
    environment:
      WHISPER_URL: http://whisper-local:8082/v1/audio/transcriptions
      OUTPUT_DIR: /data/output
      TMPDIR: /data/output
      PORT: "8084"
      PUBLIC_CONCURRENCY: "1"
      PUBLIC_FACADE_ENABLED: "0"
      PUBLIC_MAX_INLINE_BYTES: "26214400"
      PUBLIC_MAX_INLINE_ZIP_BYTES: "26214400"
    volumes:
      - ./public_server.py:/app/public_server.py:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864,mode=1777
      - /data/output:rw,noexec,nosuid,size=536870912,mode=1777
    ports:
      - "10.77.0.1:18084:8084"
    networks:
      trans:
    depends_on:
      whisper:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  portal-full:
    container_name: blue-transcription-mcp-portal-full
    image: ghcr.io/conexaoazul/blue-transcription-mcp-candidate@sha256:f821d20d24d014953d74132387542d755d94f1217ed090563a8696bc88b41f32
    restart: unless-stopped
    read_only: true
    entrypoint: ["python", "/app/full_portal_server.py"]
    environment:
      WHISPER_URL: http://whisper-local:8082/v1/audio/transcriptions
      OUTPUT_DIR: /data/output
      TMPDIR: /data/output
      PORT: "8086"
      MCP_ALLOWED_HOSTS: "mcp-origin.conexaoazul.com,mcp-origin.conexaoazul.com:*,127.0.0.1:*,localhost:*"
      MCP_ALLOWED_ORIGINS: "https://mcp-origin.conexaoazul.com,http://127.0.0.1:*,http://localhost:*"
    volumes:
      - ./full_portal_server.py:/app/full_portal_server.py:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864,mode=1777
      - /data/output:rw,noexec,nosuid,size=536870912,mode=1777
    ports:
      - "10.77.0.1:18086:8086"
    networks:
      trans:
    depends_on:
      whisper:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes: {}
