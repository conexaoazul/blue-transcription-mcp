services:
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp@sha256:56bbe81d2dc2e0bc886b6071efece9f1a4f2d0e8ed578db9f59a8cfcb1f2bf95
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        test -s /models/ggml-small.bin || ./models/download-ggml-model.sh small /models
        exec ./build/bin/whisper-server           --model /models/ggml-small.bin           --host 0.0.0.0 --port 8082           --inference-path /v1/audio/transcriptions           --convert --threads 2
    volumes:
      - whisper_models:/models
    networks:
      - transcribe
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8082'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == blueops-oci-worker-1
      resources:
        reservations:
          cpus: "0.25"
          memory: 512M
        limits:
          cpus: "2.00"
          memory: 2048M
      restart_policy:
        condition: on-failure
        delay: 10s

  mcp:
    image: ghcr.io/conexaoazul/blue-transcription-mcp:${IMAGE_TAG:?set IMAGE_TAG}
    user: "1000:1000"
    read_only: true
    environment:
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "8083"
      WHISPER_URL: http://whisper:8082/v1/audio/transcriptions
      MCP_AUTH_TOKEN_FILE: /run/secrets/transcription_mcp_auth
      MCP_ALLOWED_HOSTS: mcp-origin.conexaoazul.com,mcp-origin.conexaoazul.com:*,10.77.0.4:*,127.0.0.1:*,localhost:*
      MCP_ALLOWED_ORIGINS: https://mcp-origin.conexaoazul.com,http://10.77.0.4:*,http://127.0.0.1:*,http://localhost:*
      ALLOWED_INPUT_ROOTS: /data/inbox
      OUTPUT_DIR: /data/output
      TMPDIR: /data/output
      MAX_DOWNLOAD_BYTES: "524288000"
      MAX_INLINE_BYTES: "26214400"
      MAX_BATCH_FILES: "100"
      BATCH_CONCURRENCY: "1"
      MAX_BATCH_ITEM_BYTES: "262144000"
      MAX_ZIP_EXTRACT_BYTES: "536870912"
      MAX_ZIP_ENTRIES: "5000"
    secrets:
      - source: transcription_mcp_auth
        target: transcription_mcp_auth
        uid: "1000"
        gid: "1000"
        mode: 0400
    volumes:
      - transcription_inbox:/data/inbox:ro
      - transcription_output:/data/output
    ports:
      - target: 8083
        published: 18083
        protocol: tcp
        mode: host
    networks:
      - transcribe
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == blueops-oci-worker-1
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

  ui:
    image: ghcr.io/conexaoazul/blue-transcription-ui:${UI_IMAGE_TAG:?set UI_IMAGE_TAG}
    user: "1000:1000"
    read_only: true
    environment:
      WHISPER_API_URL: http://whisper:8082/v1/audio/transcriptions
      WHISPER_API_KEY: not-needed
      WHISPER_MODEL: whisper-1
      MAX_UPLOAD_MB: "250"
      REQUEST_TIMEOUT: "1200"
      WHISPER_RTF_ESTIMATE: "0.8"
      OUTPUT_DIR: /data/outputs
      TMPDIR: /data/outputs
      ALLOWED_ORIGINS: "*"
      OLLAMA_URL: http://127.0.0.1:9
    volumes:
      - ui_output:/data/outputs
    networks:
      - transcribe
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)); raise SystemExit(0 if d.get('status') == 'ok' and d.get('upstream') == 'ok' else 1)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == blueops-oci-worker-2
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "1.00"
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

networks:
  transcribe:
    driver: overlay
    attachable: true
volumes:
  whisper_models:
  transcription_inbox:
  transcription_output:
  ui_output:

secrets:
  transcription_mcp_auth:
    external: true
