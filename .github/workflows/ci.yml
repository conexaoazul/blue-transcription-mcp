name: CI

on:
  push:
    branches:
      - "feat/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --pull -t blue-transcription-mcp:test .

      - name: Compile server
        run: docker run --rm --entrypoint python blue-transcription-mcp:test -m py_compile /app/server.py /app/metering.py /app/tenant_admin.py

      - name: Run unit tests
        run: |
          docker run --rm \
            -e OUTPUT_DIR=/tmp/out \
            -v "$PWD/tests:/tests:ro" \
            --entrypoint python \
            blue-transcription-mcp:test \
            -m unittest discover -s /tests -v

      - name: Smoke metered tenant HTTP auth
        run: |
          docker run --rm --entrypoint /bin/bash blue-transcription-mcp:test -lc '
            set -euo pipefail
            export OUTPUT_DIR=/tmp/out
            export METERING_ENABLED=1
            export METERING_DB=/tmp/metering.sqlite3
            export METERING_REQUIRE_REQUEST_ID=1
            export MCP_AUTH_TOKEN=master-smoke-token
            export TRANSPORT=http
            export HOST=127.0.0.1
            export PORT=8083
            mkdir -p "$OUTPUT_DIR"
            python /app/tenant_admin.py create \
              --id ci-trial --name "CI Trial" --plan trial \
              --quota-minutes 120 --days 7 --max-concurrency 1 \
              >/tmp/tenant.json
            python /app/server.py >/tmp/server.log 2>&1 &
            server_pid=$!
            trap "kill $server_pid 2>/dev/null || true" EXIT
            python - <<"PY"
import json
import time
import httpx

tenant = json.load(open("/tmp/tenant.json"))
key = tenant["api_key"]
base = "http://127.0.0.1:8083"

for _ in range(60):
    try:
        r = httpx.get(base + "/healthz", timeout=1)
        if r.status_code == 200:
            break
    except Exception:
        time.sleep(0.2)
else:
    raise SystemExit("server did not become healthy")

health = r.json()
assert health["metering_enabled"] is True, health

r = httpx.get(base + "/usage", timeout=3)
assert r.status_code == 401, r.text

headers = {"Authorization": "Bearer " + key}
r = httpx.get(base + "/usage", headers=headers, timeout=3)
assert r.status_code == 200, r.text
usage = r.json()
assert usage["tenant_id"] == "ci-trial", usage
assert usage["quota_seconds"] == 7200, usage
assert usage["used_seconds"] == 0, usage

mcp_headers = {
    **headers,
    "Accept": "application/json, text/event-stream",
    "Content-Type": "application/json",
}
init = {
    "jsonrpc": "2.0",
    "id": 1,
    "method": "initialize",
    "params": {
        "protocolVersion": "2025-06-18",
        "capabilities": {},
        "clientInfo": {"name": "ci-metering-smoke", "version": "1"},
    },
}
r = httpx.post(base + "/mcp", headers=mcp_headers, json=init, timeout=5)
assert r.status_code == 200, r.text
session_id = r.headers.get("mcp-session-id")
assert session_id, r.headers
mcp_headers["Mcp-Session-Id"] = session_id
httpx.post(
    base + "/mcp",
    headers=mcp_headers,
    json={"jsonrpc":"2.0","method":"notifications/initialized"},
    timeout=5,
)
r = httpx.post(
    base + "/mcp",
    headers=mcp_headers,
    json={"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}},
    timeout=5,
)
assert r.status_code == 200, r.text
assert "transcribe_zip_base64" in r.text, r.text
assert "request_id" in r.text, r.text
PY
          '

  publish-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/batch-zip-transcription-20260925'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/blue-transcription-mcp-candidate:sha-${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push candidate image
        run: docker push "$IMAGE"

      - name: Emit immutable candidate reference
        run: |
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          echo "candidate=$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "$DIGEST"
