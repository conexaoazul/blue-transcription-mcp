name: CI

on:
  push:
    branches:
      - "feat/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --pull -t blue-transcription-mcp:test .

      - name: Compile server
        run: docker run --rm --entrypoint python blue-transcription-mcp:test -m py_compile /app/server.py /app/metering.py /app/tenant_admin.py

      - name: Run unit tests
        run: |
          docker run --rm \
            -e OUTPUT_DIR=/tmp/out \
            -v "$PWD/tests:/tests:ro" \
            --entrypoint python \
            blue-transcription-mcp:test \
            -m unittest discover -s /tests -v

      - name: Smoke metered tenant HTTP auth
        run: |
          docker run --rm \
            -v "$PWD/tests:/tests:ro" \
            --entrypoint python \
            blue-transcription-mcp:test \
            /tests/http_metering_smoke.py

  publish-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/tenant-rate-limits-20261005'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/blue-transcription-mcp-candidate:sha-${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push candidate image
        run: docker push "$IMAGE"

      - name: Emit immutable candidate reference
        run: |
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          echo "candidate=$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "$DIGEST"
